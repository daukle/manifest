name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      line_endings: true
      toolchains: node
      runners: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      node_install: 'echo "no dependencies: that is the point"'
      node_test: 'npm test'
    secrets:
      envPAT: ${{ secrets.PAT }}
